name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - .golangci.yml
      - Dockerfile
      - docker-compose.yml
      - nginx/nginx.conf
      - .github/workflows/backend.yaml
  pull_request:
    branches:
      - main
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - .golangci.yml
      - Dockerfile
      - docker-compose.yml
      - nginx/nginx.conf
      - .github/workflows/backend.yaml

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test, Build and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install mockgen
        run: go install github.com/golang/mock/mockgen@v1.6.0

      - name: Generate mocks
        run: go generate ./...

      - name: Verify generated code is up to date
        run: git diff --exit-code

      - name: Run tests
        run: go test ./...

      - name: Build
        run: make build

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2
          args: ./...

  cd:
    name: Deployment
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -e
            cd /home/Backend/TaskScheduler

            git pull origin main
            docker compose up -d --build

            sudo cp nginx/nginx.conf /tmp/taskscheduler.conf
            sudo mv /tmp/taskscheduler.conf /etc/nginx/conf.d/taskscheduler.conf
            sudo nginx -t
            sudo systemctl reload nginx
